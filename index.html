<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Juno's Pocket Friends</title>
    <meta name="description" content="Five tiny friends live in glass pebbles on Juno's keychain. Pick it up, give it a shake, and read the note they left for whoever finds them." />
    <meta property="og:title" content="Juno's Pocket Friends" />
    <meta property="og:description" content="Five tiny friends live in glass pebbles on Juno's keychain. Pick it up, give it a shake, and read the note they left for whoever finds them." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" id="theme-color" content="#5d86b0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Homemade+Apple&family=IBM+Plex+Mono:wght@500&display=swap" />
  </head>
  <body>
    <canvas id="scene" aria-label="A keychain of glass pebbles with tiny characters inside. Drag to swing it."></canvas>

    <p class="weather" id="weather" aria-live="polite">
      <span class="kept"><button type="button" id="w-city" title="Try another city"></button>,</span>
      <span id="w-temp"></span><span class="kept"><button type="button" id="w-sky" title="Try other weather"></button>,</span>
      <span class="kept"><button type="button" id="w-time" title="Try another time of day"></button>,</span>
      <button type="button" id="w-season" title="Try a season"></button>
    </p>
    <div class="choices" id="choices" role="menu" hidden></div>

    <div class="loading" id="loading">
      <p class="loading-line" id="loading-line"></p>
      <p class="loading-count" id="loading-count">[0%]</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
